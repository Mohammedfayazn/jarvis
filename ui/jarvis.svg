<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feGaussianBlur stdDeviation="30" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06152d" />
      <stop offset="60%" stop-color="#020813" />
      <stop offset="100%" stop-color="#000308" />
    </radialGradient>

    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00d8ff" />
      <stop offset="80%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="arc-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="arc-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="40%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#00d8ff" />
    </linearGradient>
  </defs>

  <style>
    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-counter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulse-core {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 15px #00f2fe); }
    }

    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.03); opacity: 0.6; }
    }

    @keyframes dash-spin {
      0% { stroke-dashoffset: 0; transform: rotate(0deg); }
      100% { stroke-dashoffset: 360; transform: rotate(360deg); }
    }

    .rot-cw-fast { transform-origin: 400px 400px; animation: spin-clockwise 8s linear infinite; }
    .rot-cw-mid { transform-origin: 400px 400px; animation: spin-clockwise 20s linear infinite; }
    .rot-cw-slow { transform-origin: 400px 400px; animation: spin-clockwise 40s linear infinite; }
    .rot-ccw-fast { transform-origin: 400px 400px; animation: spin-counter 10s linear infinite; }
    .rot-ccw-mid { transform-origin: 400px 400px; animation: spin-counter 25s linear infinite; }
    .rot-ccw-slow { transform-origin: 400px 400px; animation: spin-counter 50s linear infinite; }
    
    .pulsing-core { transform-origin: 400px 400px; animation: pulse-core 3s ease-in-out infinite; }
    .pulsing-grid { transform-origin: 400px 400px; animation: pulse-slow 4s ease-in-out infinite; }
    .dashed-ring { transform-origin: 400px 400px; animation: dash-spin 15s linear infinite; }
  </style>

  <!-- Deep Space Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" />

  <!-- Background Tech Grid / Radial Guide -->
  <g class="pulsing-grid" stroke="#00d8ff" stroke-opacity="0.15" stroke-width="1" fill="none">
    <circle cx="400" cy="400" r="380" stroke-dasharray="2 10" />
    <circle cx="400" cy="400" r="350" />
    <circle cx="400" cy="400" r="280" stroke-dasharray="4 6" />
    <circle cx="400" cy="400" r="170" />
    <line x1="400" y1="0" x2="400" y2="800" stroke-opacity="0.1" />
    <line x1="0" y1="400" x2="800" y2="400" stroke-opacity="0.1" />
    <line x1="117" y1="117" x2="683" y2="683" stroke-opacity="0.05" />
    <line x1="117" y1="683" x2="683" y2="117" stroke-opacity="0.05" />
  </g>

  <!-- Outer HUD Ring & Crosshairs -->
  <g class="rot-cw-slow" filter="url(#glow-core)">
    <!-- Segmented Outer Ring -->
    <circle cx="400" cy="400" r="330" stroke="#00d8ff" stroke-width="2" stroke-dasharray="120 20 40 20 80 20" fill="none" opacity="0.6" />
    <circle cx="400" cy="400" r="320" stroke="#0055ff" stroke-width="1" stroke-dasharray="50 15 10 15" fill="none" opacity="0.4" />
    
    <!-- Outer Tech Nodes -->
    <circle cx="730" cy="400" r="4" fill="#00d8ff" />
    <circle cx="70" cy="400" r="4" fill="#00d8ff" />
    <circle cx="400" cy="70" r="4" fill="#00d8ff" />
    <circle cx="400" cy="730" r="4" fill="#00d8ff" />
  </g>

  <!-- Counter-Rotating Secondary Ring -->
  <g class="rot-ccw-mid" filter="url(#glow-core)">
    <path d="M 120 400 A 280 280 0 0 1 680 400" fill="none" stroke="url(#arc-grad-1)" stroke-width="3" stroke-dasharray="160 20 80 20 40 40" />
    <path d="M 680 400 A 280 280 0 0 1 120 400" fill="none" stroke="url(#arc-grad-1)" stroke-width="3" stroke-dasharray="200 40 50 20" />
    
    <!-- Decorative HUD Chevron Triangles -->
    <polygon points="390,115 400,125 410,115" fill="#00d8ff" opacity="0.8" />
    <polygon points="390,685 400,675 410,685" fill="#00d8ff" opacity="0.8" />
    <polygon points="115,390 125,400 115,410" fill="#00d8ff" opacity="0.8" />
    <polygon points="685,390 675,400 685,410" fill="#00d8ff" opacity="0.8" />
  </g>

  <!-- Outer Hazard Arc (Orange/Red Accent) -->
  <g class="rot-cw-fast" filter="url(#glow-core)">
    <path d="M 400 150 A 250 250 0 0 1 650 400" fill="none" stroke="url(#arc-grad-2)" stroke-width="4" stroke-dasharray="50 30 15 30 15 30" opacity="0.7" />
    <path d="M 400 650 A 250 250 0 0 1 150 400" fill="none" stroke="url(#arc-grad-2)" stroke-width="2" stroke-dasharray="120 40 20 40" opacity="0.5" />
  </g>

  <!-- Mid-Level Detail Rings & Tick Marks -->
  <g class="rot-ccw-slow">
    <!-- Concentric Tick Ring -->
    <circle cx="400" cy="400" r="220" stroke="#00d8ff" stroke-width="8" stroke-dasharray="2 10" fill="none" opacity="0.4" />
    <circle cx="400" cy="400" r="205" stroke="#a5f3fc" stroke-width="1" stroke-dasharray="400 10 80 10" fill="none" opacity="0.6" />
  </g>

  <!-- Triangular Arc Reactor Frame Elements -->
  <g class="rot-cw-mid" filter="url(#glow-core)">
    <polygon points="400,210 565,495 235,495" fill="none" stroke="#00d8ff" stroke-width="2" stroke-opacity="0.4" />
    <polygon points="400,590 235,305 565,305" fill="none" stroke="#0055ff" stroke-width="1.5" stroke-dasharray="100 20 40 20" stroke-opacity="0.5" />
    <circle cx="400" cy="210" r="5" fill="#00f2fe" />
    <circle cx="565" cy="495" r="5" fill="#00f2fe" />
    <circle cx="235" cy="495" r="5" fill="#00f2fe" />
  </g>

  <!-- Inner High-Speed Tech Ring -->
  <g class="rot-ccw-fast" filter="url(#glow-intense)">
    <circle cx="400" cy="400" r="150" stroke="#00f2fe" stroke-width="4" stroke-dasharray="70 20 10 20 30 20" fill="none" />
    <circle cx="400" cy="400" r="135" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="150 15 50 15" fill="none" opacity="0.8" />
  </g>

  <!-- Inner Aperture Blades -->
  <g class="rot-cw-fast" stroke="#00d8ff" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 330 330 L 370 270 M 470 330 L 530 370 M 470 470 L 430 530 M 330 470 L 270 430" />
    <polygon points="400,285 415,300 385,300" fill="#00d8ff" opacity="0.5" />
    <polygon points="400,515 415,500 385,500" fill="#00d8ff" opacity="0.5" />
    <polygon points="285,400 300,415 300,385" fill="#00d8ff" opacity="0.5" />
    <polygon points="515,400 500,415 500,385" fill="#00d8ff" opacity="0.5" />
  </g>

  <!-- Core Glass Base & Inner Ring -->
  <circle cx="400" cy="400" r="105" fill="#021329" stroke="#00d8ff" stroke-width="3" opacity="0.8" filter="url(#glow-core)" />
  <circle cx="400" cy="400" r="95" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="40 10 10 10" class="rot-ccw-mid" />

  <!-- Central Glowing Arc Reactor Core -->
  <g class="pulsing-core">
    <!-- Deep Core Glow Base -->
    <circle cx="400" cy="400" r="85" fill="url(#core-grad)" filter="url(#glow-intense)" />
    
    <!-- Geometric Core Crystal Rays -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.9" filter="url(#glow-core)">
      <polygon points="400,330 420,380 400,370 380,380" fill="#a5f3fc" opacity="0.5" />
      <polygon points="400,470 420,420 400,430 380,420" fill="#a5f3fc" opacity="0.5" />
      <polygon points="330,400 380,420 370,400 380,380" fill="#a5f3fc" opacity="0.5" />
      <polygon points="470,400 420,420 430,400 420,380" fill="#a5f3fc" opacity="0.5" />
      
      <!-- Center Bright Star/Cross -->
      <circle cx="400" cy="400" r="25" fill="#ffffff" filter="url(#glow-intense)" />
      <path d="M 400 365 L 400 435 M 365 400 L 435 400" stroke="#00d8ff" stroke-width="3" />
      <path d="M 375 375 L 425 425 M 375 425 L 425 375" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Center Point Flare -->
    <circle cx="400" cy="400" r="8" fill="#ffffff" />
  </g>

  <!-- Foreground HUD Overlay / Text Data -->
  <g fill="#00d8ff" font-family="monospace" font-size="10" letter-spacing="2" opacity="0.7">
    <!-- Top Left Data Block -->
    <text x="60" y="80" font-size="12" font-weight="bold" fill="#00f2fe">SYSTEM: ONLINE</text>
    <text x="60" y="100">PWR: 100% [A1-CORE]</text>
    <text x="60" y="115">DIAG: OPTIMAL</text>
    <line x1="55" y1="65" x2="180" y2="65" stroke="#00d8ff" stroke-width="2" />
    <line x1="55" y1="65" x2="55" y2="125" stroke="#00d8ff" stroke-width="2" />

    <!-- Top Right Data Block -->
    <text x="630" y="80" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="end">J.A.R.V.I.S. AI</text>
    <text x="630" y="100" text-anchor="end">V 3.0.8</text>
    <text x="630" y="115" text-anchor="end">LOC: ACTIVE</text>
    <line x1="510" y1="65" x2="635" y2="65" stroke="#00d8ff" stroke-width="2" />
    <line x1="635" y1="65" x2="635" y2="125" stroke="#00d8ff" stroke-width="2" />

    <!-- Bottom Data Angles -->
    <text x="60" y="720">PROTOCOL: SECURE</text>
    <text x="60" y="735">ENCRYPTION: 1024-BIT</text>
    <text x="740" y="720" text-anchor="end">37.7749° N</text>
    <text x="740" y="735" text-anchor="end">122.4194° W</text>
  </g>
</svg>
