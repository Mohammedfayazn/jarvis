<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>J.A.R.V.I.S.</title>
<!-- Uthmani Quran text needs a font that draws its small marks correctly -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #cfefff;
    --muted: #4d7a90;

    /* Har haalat ka apna rang - poori screen isi se rangti hai */
    --accent: #00d8ff;
    --accent-soft: rgba(0, 216, 255, 0.35);

    /* Mic level, 0..1 - mic thread se live aata hai */
    --level: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #000308;
    color: var(--ink);
    font-family: "Consolas", "SF Mono", ui-monospace, monospace;
    overflow: hidden;
  }

  /* Poori screen ka rang ------------------------------------------------ */

  /* Kinaron ki roshni - aankh ke kone se bhi dikh jati hai ki kya chal raha
     hai, padhna nahi padta. */
  #edge {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    box-shadow: inset 0 0 180px 10px var(--accent-soft);
    transition: box-shadow 400ms ease;
  }

  body[data-state="listening"] #edge {
    animation: edgeBreathe 4s ease-in-out infinite;
  }

  body[data-state="thinking"] #edge {
    animation: edgeBreathe 1.1s ease-in-out infinite;
  }

  @keyframes edgeBreathe {
    0%, 100% { box-shadow: inset 0 0 140px 6px var(--accent-soft); }
    50%      { box-shadow: inset 0 0 220px 16px var(--accent-soft); }
  }

  /* Orb ----------------------------------------------------------------- */

  #stage { position: fixed; inset: 0; display: grid; place-items: center; }

  #orb {
    width: min(78vh, 78vw);
    height: min(78vh, 78vw);
    transform: scale(calc(1 + var(--level) * 0.05));
    transition: transform 90ms linear, filter 350ms ease, opacity 400ms ease;
  }

  #orb svg { display: block; width: 100%; height: 100%; }

  body[data-state="connecting"] #orb { opacity: 0.4; filter: saturate(0.25) brightness(0.65); }

  body[data-state="listening"] #orb {
    filter: saturate(1.05) brightness(calc(1 + var(--level) * 0.5));
  }

  /* Soch raha hai - amber, aur dheere ghoomta hua.
     SVG ka base cyan (~190deg) hai, isliye amber ke liye -160 chahiye. */
  body[data-state="thinking"] #orb {
    filter: saturate(1.35) brightness(1.05) hue-rotate(-160deg);
    animation: spin 8s linear infinite;
  }

  /* Bol raha hai - banafshi, cyan se +75deg */
  body[data-state="speaking"] #orb {
    filter: saturate(1.3) brightness(1.25) hue-rotate(75deg);
    animation: pulse 1.3s ease-in-out infinite;
  }

  body[data-state="reconnecting"] #orb {
    filter: saturate(0.55) brightness(0.75) hue-rotate(-30deg);
    opacity: 0.7;
  }

  body[data-state="offline"] #orb { opacity: 0.2; filter: grayscale(1) brightness(0.45); }

  body[data-state="sleeping"] #orb {
    opacity: 0.3;
    filter: saturate(0.4) brightness(0.55) hue-rotate(40deg);
    animation: breathe 7s ease-in-out infinite;
  }

  @keyframes spin  { to { transform: rotate(360deg) scale(calc(1 + var(--level) * 0.05)); } }
  @keyframes pulse { 0%, 100% { opacity: 0.88; } 50% { opacity: 1; } }

  /* Bada status - yahi asli jawab hai "abhi bolun ya rukun" ka ----------- */

  #banner {
    position: fixed;
    top: 7vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    text-align: center;
    white-space: nowrap;
  }

  #headline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: clamp(20px, 3.4vw, 38px);
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 26px var(--accent-soft);
    transition: color 300ms ease;
  }

  #dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
    flex: none;
  }

  body[data-state="listening"] #dot { animation: blink 1.8s ease-in-out infinite; }
  body[data-state="thinking"]  #dot { animation: blink 0.5s ease-in-out infinite; }
  body[data-state="speaking"]  #dot { animation: blink 0.9s ease-in-out infinite; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  #sub {
    margin-top: 10px;
    font-size: clamp(11px, 1.2vw, 14px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 300ms ease;
  }

  body[data-state="listening"] #sub { color: var(--accent); opacity: 0.85; }

  /* Mic meter - sirf sunte waqt zinda dikhta hai ------------------------- */

  #meter {
    position: fixed;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    width: min(420px, 64vw);
    height: 6px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 3px;
    overflow: hidden;
    opacity: 0.28;
    transition: opacity 300ms ease;
  }

  body[data-state="listening"] #meter { opacity: 1; }
  /* Sote waqt bhi sun raha hai (sirf wake word) - meter halka zinda */
  body[data-state="sleeping"] #meter { opacity: 0.55; }

  #meter i {
    display: block;
    height: 100%;
    width: calc(var(--level) * 100%);
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
    transition: width 90ms linear;
  }

  #hint {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    font-size: 10.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Transcript rail ----------------------------------------------------- */

  #log {
    position: fixed;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 4;
    width: min(320px, 28vw);
    max-height: 62vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 12px;
    pointer-events: none;
  }

  .line {
    font-size: 12.5px;
    line-height: 1.55;
    padding-left: 12px;
    border-left: 2px solid var(--muted);
    color: var(--muted);
    animation: slide 280ms ease-out;
  }

  .line .who {
    display: block;
    font-size: 9.5px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 3px;
    opacity: 0.75;
  }

  .line.jarvis { border-left-color: #b388ff; color: var(--ink); }
  .line.jarvis .who { color: #b388ff; }
  .line.user { border-left-color: #00f2fe; color: #bfe9f7; }
  .line.user .who { color: #00f2fe; }
  /* Jarvis ne kuch kiya, kaha nahi - jaise browser windows band karna */
  .line.system { border-left-color: #ffb300; color: #f0d9a8; font-style: italic; }
  .line.system .who { color: #ffb300; font-style: normal; }

  @keyframes slide {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (max-width: 820px) { #log { display: none; } }

  /* Quran / Islamic lesson panel ----------------------------------------- */

  #quran {
    --q-gold: #e8c77a;
    position: fixed;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: min(480px, 42vw);
    max-height: 84vh;
    overflow-y: auto;
    padding: 20px 22px 18px;
    background: rgba(2, 14, 21, 0.94);
    border: 1px solid rgba(232, 199, 122, 0.35);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    display: none;
    animation: slide 280ms ease-out;
  }
  #quran.open { display: block; }

  #quran .q-head { display: flex; align-items: flex-start; gap: 10px; }
  #quran .q-title {
    flex: 1;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--q-gold);
  }
  #quran .q-student {
    display: block;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  #quran .q-sub { font-size: 12.5px; line-height: 1.55; color: #9fc4d4; margin: 8px 0 14px; }

  #quran button {
    font: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #quran button:hover { background: rgba(255, 255, 255, 0.12); }
  #quran button:focus-visible { outline: 2px solid var(--q-gold); outline-offset: 2px; }
  #quran .q-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  .ar {
    font-family: "Amiri Quran", "Traditional Arabic", "Arabic Typesetting", "Sakkal Majalla", serif;
    direction: rtl;
    text-align: right;
    color: #f6ecd2;
  }

  .q-ayah {
    padding: 12px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    opacity: 0.45;
  }
  .q-ayah.focus { opacity: 1; }
  .q-ayah .ar { font-size: 30px; line-height: 1.75; }
  .q-ayah .num {
    display: inline-block;
    font-size: 11px;
    color: var(--q-gold);
    margin-bottom: 2px;
  }
  .q-ayah .tr { font-size: 12.5px; font-style: italic; color: #bfe0ec; margin-top: 4px; }
  .q-ayah .en { font-size: 12.5px; line-height: 1.5; color: #8fb3c2; margin-top: 3px; }
  .q-ayah .note { font-size: 12px; color: var(--q-gold); margin-top: 6px; }

  .q-letters { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .q-letter {
    flex: 1 1 150px;
    text-align: center;
    padding: 14px 10px;
    border: 1px solid rgba(232, 199, 122, 0.3);
    border-radius: 12px;
  }
  .q-letter .ar { font-size: 72px; line-height: 1.3; text-align: center; }
  .q-letter .name { font-size: 16px; color: var(--q-gold); }
  .q-letter .sound { font-size: 11.5px; line-height: 1.45; color: #8fb3c2; margin-top: 6px; }

  .q-question { font-size: 20px; line-height: 1.5; margin: 6px 0 16px; }
  .q-question .ar { display: inline-block; font-size: 60px; line-height: 1.2; vertical-align: middle; padding: 0 10px; }
  .q-options { display: grid; gap: 10px; }
  .q-option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px;
    font-size: 18px;
  }
  .q-option .n {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(232, 199, 122, 0.18);
    color: var(--q-gold);
    font-size: 15px;
  }
  .q-option .ar { font-size: 36px; line-height: 1.3; }

  .q-big { font-size: 44px; text-align: center; color: var(--q-gold); margin: 6px 0; }
  .q-big.good { color: #00ff9d; }
  .q-text { font-size: 14px; line-height: 1.6; }

  .q-listening {
    display: flex; align-items: center; gap: 12px;
    font-size: 15px; color: #00ff9d; margin: 4px 0 8px;
  }
  .q-listening i {
    width: 14px; height: 14px; border-radius: 50%;
    background: #00ff9d;
    animation: blink 0.9s ease-in-out infinite;
  }

  .q-words { display: flex; flex-wrap: wrap; gap: 6px 8px; direction: rtl; margin: 10px 0 14px; }
  .q-word {
    font-family: "Amiri Quran", "Traditional Arabic", serif;
    font-size: 24px;
    line-height: 1.8;
    padding: 0 8px;
    border-radius: 8px;
    border-bottom: 3px solid transparent;
  }
  .q-word.correct { color: #9dffcf; border-bottom-color: #00c77a; }
  .q-word.close   { color: #ffe08a; border-bottom-color: #ffb300; }
  .q-word.wrong   { color: #ffb3c6; border-bottom-color: #ff3366; }
  .q-word.missing { color: #ffb3c6; border-bottom: 3px dashed #ff3366; opacity: 0.8; }
  .q-word.extra   { color: #8fa6b0; text-decoration: line-through; }
  .q-legend { font-size: 11px; color: var(--muted); }
  /* Arabic inside an English sentence: isolated so it can't reorder the words around it */
  bdi.ar-inline { font-family: "Amiri Quran", "Traditional Arabic", serif; font-size: 1.35em; color: #f6ecd2; }

  .q-plan { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .q-plan li { padding: 10px 12px; border-left: 3px solid var(--q-gold); background: rgba(255,255,255,0.03); }
  .q-plan b { display: block; font-size: 10px; letter-spacing: 2px; color: var(--q-gold); text-transform: uppercase; }
  .q-plan span { font-size: 13.5px; }
  .q-plan small { display: block; font-size: 11.5px; color: #8fb3c2; margin-top: 2px; }

  /* Speech coach views */
  .c-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .c-card {
    text-align: center; padding: 14px 8px 12px;
    border: 1px solid rgba(232, 199, 122, 0.3); border-radius: 14px;
  }
  .c-card .emoji { font-size: 64px; line-height: 1.15; }
  .c-card .word { font-size: 20px; color: var(--q-gold); margin-top: 6px; }
  .c-card .also { font-size: 12px; color: #8fb3c2; margin-top: 4px; line-height: 1.5; }
  .c-say { text-align: center; }
  .c-say .emoji { font-size: 120px; line-height: 1.1; }
  .c-say .word { font-size: 34px; color: var(--q-gold); margin: 6px 0 10px; }
  .c-scene {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px;
    font-size: 72px; line-height: 1.2; padding: 10px 0 4px;
  }
  .c-question { text-align: center; font-size: 24px; color: var(--q-gold); margin-top: 8px; }
  .c-said { font-size: 18px; color: #8fb3c2; }
  .c-bigger { font-size: 24px; line-height: 1.45; color: #9dffcf; margin-top: 10px; }
  .c-stars { text-align: center; font-size: 44px; letter-spacing: 6px; margin: 8px 0; }
  .c-report { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }

  @media (max-width: 820px) {
    #quran {
      left: 16px; right: 16px; top: auto; bottom: 16px;
      transform: none; width: auto; max-height: 70vh;
    }
  }
</style>
</head>
<body data-state="connecting">

  <div id="stage"><div id="orb"></div></div>
  <div id="edge"></div>

  <div id="banner">
    <div id="headline"><span id="dot"></span><span id="label">Connecting</span></div>
    <div id="sub">Gemini Live se jud rahe hain</div>
  </div>

  <div id="log"></div>

  <section id="quran" aria-live="polite" aria-label="Quran lesson"></section>

  <div id="meter"><i></i></div>
  <div id="hint">Band karne ke liye bolein: &ldquo;Jarvis so jao&rdquo;</div>

<script>
(() => {
  "use strict";

  const body  = document.body;
  const orb   = document.getElementById("orb");
  const label = document.getElementById("label");
  const sub   = document.getElementById("sub");
  const log   = document.getElementById("log");
  const root  = document.documentElement;

  // Har haalat: bada shabd, neeche saaf hidayat, aur ek rang.
  const STATES = {
    connecting: {
      label: "Connecting",
      sub:   "Gemini Live se jud rahe hain",
      accent: "#00d8ff", soft: "rgba(0,216,255,0.22)",
    },
    listening: {
      label: "Speak now",
      sub:   "Jarvis sun raha hai - bol dijiye",
      accent: "#00ff9d", soft: "rgba(0,255,157,0.30)",
    },
    thinking: {
      label: "Got it - one sec",
      sub:   "Ab rukiye, jawab ban raha hai",
      accent: "#ffb300", soft: "rgba(255,179,0,0.30)",
    },
    speaking: {
      label: "Jarvis speaking",
      sub:   "Sunte rahiye - abhi mat boliye",
      accent: "#b388ff", soft: "rgba(179,136,255,0.30)",
    },
    reconnecting: {
      label: "Reconnecting",
      sub:   "Connection tuta - dobara jud rahe hain",
      accent: "#ff3366", soft: "rgba(255,51,102,0.30)",
    },
    sleeping: {
      label: "Sleeping",
      sub:   "Jagane ke liye bolein: “Hey Jarvis”",
      accent: "#5c6bc0", soft: "rgba(92,107,192,0.20)",
    },
    offline: {
      label: "Offline",
      sub:   "Jarvis band hai - terminal se chalu karein",
      accent: "#6b7f8a", soft: "rgba(107,127,138,0.18)",
    },
  };

  // SVG inline daalte hain (<img> ke andar CSS filters lag nahi paate)
  fetch("jarvis.svg")
    .then((r) => r.text())
    .then((svg) => { orb.innerHTML = svg; })
    .catch(() => {});

  let decay = 0;

  function setState(value) {
    const conf = STATES[value] || STATES.offline;
    body.dataset.state = value;
    label.textContent = conf.label;
    sub.textContent = conf.sub;
    root.style.setProperty("--accent", conf.accent);
    root.style.setProperty("--accent-soft", conf.soft);
    document.title = conf.label + " - J.A.R.V.I.S.";

    // Sunna band, toh meter bhi girna chahiye
    if (value !== "listening") setLevel(0);
  }

  function setLevel(value) {
    decay = Math.max(0, Math.min(1, value));
    root.style.setProperty("--level", decay.toFixed(3));
  }

  // Server chup ho jaye toh meter wahin atka na reh jaye
  setInterval(() => { if (decay > 0.001) setLevel(decay * 0.8); }, 120);

  function addLine(role, text) {
    const el = document.createElement("div");
    el.className = "line " + role;
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? "You"
                    : role === "system" ? "Action"
                    : "Jarvis";
    el.append(who, document.createTextNode(text));
    log.append(el);
    while (log.children.length > 8) log.firstChild.remove();
  }

  // --- Quran lesson panel -------------------------------------------------
  // Everything shown here comes from the network (Quran text, hadith), so it
  // is only ever inserted with textContent - never as HTML.

  const quran = document.getElementById("quran");
  let socket = null;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null && text !== "") node.textContent = text;
    return node;
  }

  function command(name) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ command: name }));
    }
  }

  function button(label, onClick) {
    const b = el("button", "", label);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }

  const AR = "\\u0600-\\u06FF\\u0750-\\u077F\\u08A0-\\u08FF";   // Arabic, Arabic Supplement, Extended-A
  const hasArabic = (s) => new RegExp("[" + AR + "]").test(s || "");

  // English with Arabic words in it: each Arabic run goes in its own <bdi>
  // so the browser's right-to-left reordering stays inside that word.
  const ARABIC_RUN = new RegExp("([" + AR + "]+(?:\\s+[" + AR + "]+)*)");
  function mixed(tag, cls, text) {
    const node = el(tag, cls);
    for (const part of String(text || "").split(ARABIC_RUN)) {
      if (!part) continue;
      if (hasArabic(part)) {
        const b = el("bdi", "ar-inline", part);
        b.dir = "rtl";
        node.append(b);
      } else {
        node.append(document.createTextNode(part));
      }
    }
    return node;
  }

  function renderVerses(items) {
    const box = el("div");
    for (const it of items || []) {
      const row = el("div", "q-ayah" + (it.focus ? " focus" : ""));
      if (it.ref) row.append(el("span", "num", it.ref));
      if (it.arabic) row.append(el("div", "ar", it.arabic));
      if (it.translit) row.append(el("div", "tr", it.translit));
      if (it.translation) row.append(el("div", "en", it.translation));
      if (it.note) row.append(mixed("div", "note", "Listen for: " + it.note));
      box.append(row);
    }
    return box;
  }

  function renderLetters(items) {
    const box = el("div", "q-letters");
    for (const it of items || []) {
      const card = el("div", "q-letter");
      card.append(el("div", "ar", it.char), el("div", "name", it.name), el("div", "sound", it.sound));
      box.append(card);
    }
    return box;
  }

  function renderQuiz(p) {
    const box = el("div");
    const q = el("div", "q-question");
    // Show an Arabic letter in the question large, the rest as text
    const parts = (p.question || "").split(new RegExp("([" + AR + "]+)"));
    for (const part of parts) {
      if (!part) continue;
      q.append(hasArabic(part) ? el("span", "ar", part) : document.createTextNode(part));
    }
    box.append(q);
    const opts = el("div", "q-options");
    for (const o of p.options || []) {
      const row = el("div", "q-option");
      row.append(el("span", "n", String(o.n)), el("span", hasArabic(o.text) ? "ar" : "", o.text));
      opts.append(row);
    }
    box.append(opts, el("div", "q-sub", "Say the answer, or its number."));
    return box;
  }

  function renderResult(p) {
    const box = el("div");
    if (p.clear) box.append(el("div", "q-big" + (p.accuracy >= 90 ? " good" : ""), p.accuracy + "%"));
    const words = el("div", "q-words");
    for (const w of p.words || []) words.append(el("span", "q-word " + w.status, w.text));
    if (p.clear) box.append(words, el("div", "q-legend",
      "green = right · amber = nearly · red = to practise · dashed = missed"));
    box.append(mixed("p", "q-text", p.text));
    return box;
  }

  function renderPlan(items) {
    const list = el("ul", "q-plan");
    const labels = { quran: "Quran", dua: "Dua", manners: "Manners", revision: "Revision" };
    for (const it of items || []) {
      const li = el("li");
      li.append(el("b", "", labels[it.part] || it.part), el("span", "", it.title), el("small", "", it.detail));
      list.append(li);
    }
    return list;
  }

  function renderCards(items) {
    const box = el("div", "c-cards");
    for (const it of items || []) {
      const card = el("div", "c-card");
      card.append(el("div", "emoji", it.emoji), mixed("div", "word", it.word));
      if (it.also && it.also.length) card.append(mixed("div", "also", it.also.join(" · ")));
      box.append(card);
    }
    return box;
  }

  const COACH_MODES = new Set(["words", "say", "scene", "sentence", "reward", "dashboard"]);

  function renderCoach(p) {
    if (p.mode === "words") return renderCards(p.items);
    if (p.mode === "say") {
      const box = el("div", "c-say");
      const live = el("div", "q-listening");
      live.append(el("i"), document.createTextNode("Listening"));
      box.append(el("div", "emoji", p.emoji), mixed("div", "word", p.word), live);
      return box;
    }
    if (p.mode === "scene") {
      const box = el("div");
      const pic = el("div", "c-scene");
      for (const e of p.picture || []) pic.append(el("span", "", e));
      box.append(pic, mixed("div", "c-question", p.question));
      return box;
    }
    if (p.mode === "sentence") {
      const box = el("div");
      box.append(mixed("div", "c-said", "“" + p.said + "”"), mixed("div", "c-bigger", p.bigger));
      return box;
    }
    if (p.mode === "reward") {
      const box = el("div");
      box.append(el("div", "c-stars", "⭐".repeat(Math.min(p.stars || 1, 8))), mixed("p", "q-text", p.text));
      return box;
    }
    return mixed("div", "c-report", p.text);          // dashboard
  }

  function renderLesson(p) {
    if (!p || p.mode === "close") { quran.classList.remove("open"); quran.replaceChildren(); return; }
    const head = el("div", "q-head");
    const title = el("div", "q-title");
    if (p.student) title.append(el("span", "q-student", p.student));
    title.append(document.createTextNode(p.title || "Lesson"));
    head.append(title, button("×", () => quran.classList.remove("open")));
    const nodes = [head];
    if (p.subtitle) nodes.push(mixed("div", "q-sub", p.subtitle));

    if (p.mode === "letters") nodes.push(renderLetters(p.items));
    else if (p.mode === "verses") nodes.push(renderVerses(p.items));
    else if (p.mode === "quiz") nodes.push(renderQuiz(p));
    else if (p.mode === "result") nodes.push(renderResult(p));
    else if (p.mode === "plan") nodes.push(renderPlan(p.items));
    else if (COACH_MODES.has(p.mode)) nodes.push(renderCoach(p));
    else if (p.mode === "feedback") {
      nodes.push(el("div", "q-big" + (p.correct ? " good" : ""), p.correct ? "✓" : "↻"));
      nodes.push(mixed("p", "q-text", p.text));
    } else if (p.mode === "recite") {
      const live = el("div", "q-listening");
      live.append(el("i"), document.createTextNode(p.title === "Checking..." ? "Checking..." : "Listening"));
      nodes.push(live);
      if (p.items && p.items.length) nodes.push(renderVerses(p.items));
    }

    const actions = el("div", "q-actions");
    if (p.mode === "recite") actions.append(button("Cancel recording", () => command("cancel_recitation")));
    if (p.has_audio) actions.append(button("Stop audio", () => command("stop_audio")));
    if (actions.children.length) nodes.push(actions);

    quran.replaceChildren(...nodes);
    quran.classList.add("open");
    quran.scrollTop = 0;
  }

  // Backend se connection. Jarvis restart ho toh page khud wapas jud jaye.
  function connect() {
    const ws = new WebSocket("ws://" + location.hostname + ":8766");
    socket = ws;

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }

      if (msg.type === "state")           setState(msg.value);
      else if (msg.type === "level")      setLevel(msg.value);
      else if (msg.type === "transcript") addLine(msg.role, msg.text);
      else if (msg.type === "panel")      renderLesson(msg.payload);
    };

    // Sote waqt bhi Jarvis chal raha hota hai (wake word sunta hai), toh
    // connection tootne ka matlab hamesha yahi hai ki program band hua.
    ws.onclose = () => { setState("offline"); setTimeout(connect, 1200); };
    ws.onerror = () => ws.close();
  }

  connect();
})();
</script>
</body>
</html>
